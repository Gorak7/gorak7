<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter & Co. | Bookstore QA Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#292e35;font-family:Georgia,serif}.head{background:#263c32;color:#fff;padding:25px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:14px}.head h1{margin:0;font-size:25px}.wrap{max-width:1050px;margin:30px auto;padding:0 20px}.hero{padding:28px;background:#e4e9df;border-radius:16px}.hero h2{font-size:32px;margin:0 0 8px}.search{display:flex;gap:10px;margin:22px 0}.search input{flex:1;min-width:0}.input, input{padding:12px;border:1px solid #cbd2c8;border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:8px;background:#315a43;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.book{background:white;border:1px solid #e3e4dc;border-radius:12px;padding:18px}.cover{height:95px;background:#e4e9df;display:grid;place-items:center;font-size:35px;border-radius:8px}.price{font-size:19px;font-weight:bold}.muted{color:#66736a}.panel{background:#fff;padding:20px;margin-top:24px;border-radius:12px}.status{padding-top:12px;min-height:28px}@media(max-width:520px){.head{align-items:flex-start;flex-direction:column}.hero h2{font-size:25px}}</style></head><body>
<header class="head"><h1>📚 Chapter & Co.</h1><span>Online Bookstore · QA demo</span></header><main class="wrap"><section class="hero"><h2>Find your next great read.</h2><p>Browse, search and manage demo books. Orders simulate checkout and do not process payments.</p><span class="muted">Test environment · no real transactions</span></section>
<div class="search"><input id="q" placeholder="Search title or author" aria-label="Search books"><button id="search" class="btn">Search</button></div><div id="books" class="grid"></div><section class="panel"><h2>Admin demo: add a book</h2><p class="muted">Creates a record through the REST API for CRUD testing.</p><input id="title" placeholder="Book title"><input id="author" placeholder="Author"><input id="price" type="number" min=".01" step=".01" placeholder="Price"><input id="stock" type="number" min="0" value="5" placeholder="Stock"><button id="create" class="btn">Create book</button><div id="status" class="status" role="status"></div></section></main>
<script>
const api='/api';const status=t=>document.getElementById('status').textContent=t;
async function load(){try{const r=await fetch(api+'/books?q='+encodeURIComponent(document.getElementById('q').value));if(!r.ok)throw Error('API '+r.status);const data=await r.json();const root=document.getElementById('books');root.replaceChildren();data.forEach(b=>{const el=document.createElement('article');el.className='book';el.innerHTML='<div class="cover">▤</div><h3></h3><p class="muted"></p><p class="price"></p><p class="muted"></p><button class="btn">Delete (demo)</button>';el.querySelector('h3').textContent=b.title;el.querySelectorAll('p')[0].textContent='by '+b.author;el.querySelector('.price').textContent='₹'+Number(b.price).toFixed(2);el.querySelectorAll('p')[2].textContent='Stock: '+b.stock;el.querySelector('button').onclick=async()=>{const d=await fetch(api+'/books/'+b.id,{method:'DELETE'});status(d.ok?'Deleted book '+b.id:'Delete failed');load()};root.append(el)})}catch(e){status('Start the Spring Boot backend and MySQL first: '+e.message)}}
document.getElementById('search').onclick=load;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
document.getElementById('create').onclick=async()=>{const payload={title:document.getElementById('title').value.trim(),author:document.getElementById('author').value.trim(),price:Number(document.getElementById('price').value),stock:Number(document.getElementById('stock').value)};try{const r=await fetch(api+'/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.message||'Validation failed');status('Created book ID '+d.id);load()}catch(e){status('Create failed: '+e.message)}};
load();
</script></body></html>
