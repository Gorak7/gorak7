name: Bookstore API regression
on:
  push:
    paths:
      - 'QA-Portfolio/Online-Bookstore-API/**'
  pull_request:
    paths:
      - 'QA-Portfolio/Online-Bookstore-API/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: bookstore
          MYSQL_USER: book_user
          MYSQL_PASSWORD: book_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build application
        working-directory: QA-Portfolio/Online-Bookstore-API/backend
        run: mvn -B package -DskipTests
      - name: Compile API automation
        working-directory: QA-Portfolio/Online-Bookstore-API/automation
        run: mvn -B test-compile
