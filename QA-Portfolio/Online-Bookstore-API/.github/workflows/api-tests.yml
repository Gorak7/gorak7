name: Bookstore API, UI and Postman regression
on:
  push:
    paths:
      - 'QA-Portfolio/Online-Bookstore-API/**'
  pull_request:
    paths:
      - 'QA-Portfolio/Online-Bookstore-API/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: bookstore
          MYSQL_USER: book_user
          MYSQL_PASSWORD: book_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build application
        working-directory: QA-Portfolio/Online-Bookstore-API/backend
        run: mvn -B package -DskipTests
      - name: Start application
        working-directory: QA-Portfolio/Online-Bookstore-API/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3308/bookstore
          SPRING_DATASOURCE_USERNAME: book_user
          SPRING_DATASOURCE_PASSWORD: book_password
        run: |
          nohup java -jar target/bookstore-app-1.0.0.jar > /tmp/bookstore.log 2>&1 &
          for i in {1..40}; do
            if curl --fail http://127.0.0.1:8081/api/health; then exit 0; fi
            sleep 3
          done
          cat /tmp/bookstore.log
          exit 1
      - name: Run REST Assured and UI screenshot tests
        working-directory: QA-Portfolio/Online-Bookstore-API/automation
        env:
          BASE_URL: http://127.0.0.1:8081
          UI_BASE_URL: http://127.0.0.1:8081
        run: mvn -B test
      - name: Run Postman collection with Newman
        working-directory: QA-Portfolio/Online-Bookstore-API
        run: |
          npx --yes newman run postman/Online-Bookstore.postman_collection.json --reporters cli,junit --reporter-junit-export automation/target/newman-results.xml
      - name: Upload reports, screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-test-evidence
          path: |
            QA-Portfolio/Online-Bookstore-API/automation/target/surefire-reports/
            QA-Portfolio/Online-Bookstore-API/automation/target/newman-results.xml
            QA-Portfolio/Online-Bookstore-API/automation/evidence/screenshots/
            /tmp/bookstore.log
          if-no-files-found: warn
          retention-days: 30
