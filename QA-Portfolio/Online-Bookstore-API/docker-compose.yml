services:
  db:
    image: mysql:8.4
    container_name: qa-bookstore-mysql
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_USER: book_user
      MYSQL_PASSWORD: book_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - bookstore_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-bookstore-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bookstore?connectTimeout=10000&socketTimeout=30000
      SPRING_DATASOURCE_USERNAME: book_user
      SPRING_DATASOURCE_PASSWORD: book_password
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  bookstore_data:
