services:
  db:
    image: mysql:8.4
    container_name: qa-bookstore-mysql
    environment:
      MYSQL_DATABASE: bookstore
      MYSQL_USER: book_user
      MYSQL_PASSWORD: book_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - bookstore_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  bookstore_data:
