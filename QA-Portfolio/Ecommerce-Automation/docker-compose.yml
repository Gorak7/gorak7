services:
  db:
    image: mysql:8.4
    container_name: qa-ecommerce-mysql
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - ecommerce_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-ecommerce-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ecommerce?connectTimeout=10000&socketTimeout=30000
      SPRING_DATASOURCE_USERNAME: qa_user
      SPRING_DATASOURCE_PASSWORD: qa_password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ecommerce_data:
