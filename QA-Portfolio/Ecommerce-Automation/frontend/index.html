<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Market | QA Demo</title>
<style>
:root{font-family:Inter,system-ui,Arial;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#14233d;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:22px;margin:0}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#dceafe,#f8fbff);padding:28px;border-radius:18px}.hero h2{margin:0 0 8px;font-size:30px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:9px}.btn{border:0;background:#2456c5;color:white;padding:11px 15px;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;padding:18px;border:1px solid #e1e7f0;border-radius:14px;box-shadow:0 3px 12px #1b31500b}.emoji{font-size:38px}.price{font-weight:750;font-size:20px}.muted{color:#64748b}.cart{margin-top:26px;background:white;padding:20px;border-radius:14px}.rowline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e8edf4}.message{margin:12px 0;padding:12px;border-radius:8px;background:#e0f2fe}label{display:block;margin:10px 0 5px}input[type=email]{padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%}@media(max-width:500px){.top{align-items:flex-start;flex-direction:column}.hero h2{font-size:24px}}
</style></head><body>
<header class="top"><h1>✦ Northstar Market</h1><span>QA Demo Store · <strong id="cartCount">0</strong> items</span></header>
<main class="wrap"><section class="hero"><h2>Everyday tech, made simple.</h2><p>Demo storefront for practicing end-to-end UI automation.</p><span class="muted">Test environment only — checkout does not process real payments.</span></section>
<div class="search"><input id="search" placeholder="Search products..." aria-label="Search products"><button class="btn" id="searchBtn">Search</button></div>
<div id="message" role="status" aria-live="polite"></div><section id="products" class="grid" aria-label="Products"></section>
<section class="cart"><h2>Your cart</h2><div id="cartItems"></div><p class="price">Total: ₹<span id="total">0.00</span></p><label for="email">Email for simulated checkout</label><input type="email" id="email" placeholder="you@example.com"><p><button class="btn" id="checkout">Place demo order</button></p><div id="orderResult" role="status"></div></section></main>
<script>
const API='/api';let products=[],cart=[];
const money=n=>Number(n).toFixed(2);
function say(t){document.getElementById('message').textContent=t}
async function loadProducts(){try{const q=document.getElementById('search').value;const r=await fetch(API+'/products?q='+encodeURIComponent(q));if(!r.ok)throw Error('API returned '+r.status);products=await r.json();renderProducts()}catch(e){say('Cannot load products. Start the Spring Boot backend and MySQL first. ('+e.message+')')}}
function renderProducts(){const root=document.getElementById('products');root.replaceChildren();products.forEach(p=>{const el=document.createElement('article');el.className='card';el.innerHTML='<div class="emoji">▣</div><h3></h3><p class="muted"></p><p class="price">₹'+money(p.price)+'</p><button class="btn">Add to cart</button>';el.querySelector('h3').textContent=p.name;el.querySelector('.muted').textContent=p.description||'Quality everyday tech';el.querySelector('button').addEventListener('click',()=>add(p.id));root.append(el)})}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const found=cart.find(x=>x.productId===id);if(found)found.quantity++;else cart.push({productId:id,name:p.name,price:Number(p.price),quantity:1});renderCart();say(p.name+' added to cart')}
function renderCart(){const root=document.getElementById('cartItems');root.replaceChildren();let total=0;cart.forEach(i=>{total+=i.price*i.quantity;const row=document.createElement('div');row.className='rowline';const name=document.createElement('span');name.textContent=i.name+' × '+i.quantity;const amount=document.createElement('strong');amount.textContent='₹'+money(i.price*i.quantity);row.append(name,amount);root.append(row)});document.getElementById('total').textContent=money(total);document.getElementById('cartCount').textContent=cart.reduce((n,i)=>n+i.quantity,0)}
document.getElementById('searchBtn').onclick=loadProducts;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')loadProducts()});
document.getElementById('checkout').onclick=async()=>{const email=document.getElementById('email').value.trim();const result=document.getElementById('orderResult');result.textContent='';if(!email||!email.includes('@')){result.textContent='Enter a valid email address.';return}if(!cart.length){result.textContent='Add at least one product before checkout.';return}try{const r=await fetch(API+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,items:cart.map(i=>({productId:i.productId,quantity:i.quantity}))})});const data=await r.json();if(!r.ok)throw Error(data.message||'Order rejected');result.textContent='Demo order '+data.orderReference+' created. Total ₹'+money(data.total)+'. No payment was taken.';cart=[];renderCart()}catch(e){result.textContent='Checkout failed: '+e.message}};
loadProducts();
</script></body></html>
