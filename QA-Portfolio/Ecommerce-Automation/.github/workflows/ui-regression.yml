name: E-Commerce UI regression and evidence
on:
  push:
    paths:
      - 'QA-Portfolio/Ecommerce-Automation/**'
  pull_request:
    paths:
      - 'QA-Portfolio/Ecommerce-Automation/**'
  workflow_dispatch:
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ecommerce
          MYSQL_USER: qa_user
          MYSQL_PASSWORD: qa_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Build backend
        working-directory: QA-Portfolio/Ecommerce-Automation/backend
        run: mvn -B package -DskipTests
      - name: Start application
        working-directory: QA-Portfolio/Ecommerce-Automation/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/ecommerce
          SPRING_DATASOURCE_USERNAME: qa_user
          SPRING_DATASOURCE_PASSWORD: qa_password
        run: |
          nohup java -jar target/ecommerce-app-1.0.0.jar > /tmp/ecommerce.log 2>&1 &
          for i in {1..40}; do
            if curl --fail http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 3
          done
          cat /tmp/ecommerce.log
          exit 1
      - name: Run Selenium tests and capture screenshots
        working-directory: QA-Portfolio/Ecommerce-Automation/automation
        env:
          BASE_URL: http://127.0.0.1:8080
          HEADLESS: 'true'
        run: mvn -B test
      - name: Capture SQL database validation output
        if: always()
        env:
          MYSQL_PWD: qa_password
        run: |
          mkdir -p QA-Portfolio/Ecommerce-Automation/evidence/generated
          mysql -h 127.0.0.1 -P 3307 -u qa_user ecommerce < QA-Portfolio/Ecommerce-Automation/database/validation.sql | tee QA-Portfolio/Ecommerce-Automation/evidence/generated/sql-validation.txt
      - name: Upload reports, screenshots and SQL output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-test-evidence
          path: |
            QA-Portfolio/Ecommerce-Automation/automation/target/surefire-reports/
            QA-Portfolio/Ecommerce-Automation/automation/evidence/screenshots/
            QA-Portfolio/Ecommerce-Automation/evidence/generated/sql-validation.txt
            /tmp/ecommerce.log
          if-no-files-found: warn
          retention-days: 30
