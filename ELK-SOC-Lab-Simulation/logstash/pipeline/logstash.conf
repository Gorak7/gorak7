input { beats { port => 5044 } }
filter {
  if [process][name] == "powershell.exe" { mutate { add_field => {"[alert][rule_id]"=>"SOC-002","[alert][rule_name]"=>"Suspicious PowerShell","[alert][severity]"=>"high","[alert][mitre_technique]"=>"T1059.001","[alert][status]"=>"open"} } }
  if [threat][indicator][type] == "encoded_command" { mutate { add_field => {"[alert][rule_id]"=>"SOC-003","[alert][rule_name]"=>"Encoded Command","[alert][severity]"=>"high","[alert][mitre_technique]"=>"T1027","[alert][status]"=>"open"} } }
  if [threat][indicator][type] == "phishing_attachment" { mutate { add_field => {"[alert][rule_id]"=>"SOC-004","[alert][rule_name]"=>"Phishing Attachment","[alert][severity]"=>"high","[alert][mitre_technique]"=>"T1566.001","[alert][status]"=>"open"} } }
  if [threat][indicator][type] == "unusual_transfer" { mutate { add_field => {"[alert][rule_id]"=>"SOC-005","[alert][rule_name]"=>"Unusual Outbound Transfer","[alert][severity]"=>"critical","[alert][mitre_technique]"=>"T1041","[alert][status]"=>"open"} } }
  if [event][category] == "authentication" and [event][outcome] == "failure" { mutate { add_field => {"[alert][rule_id]"=>"SOC-001","[alert][rule_name]"=>"Brute Force","[alert][severity]"=>"high","[alert][mitre_technique]"=>"T1110","[alert][status]"=>"open"} } }
}
output { elasticsearch { hosts => ["http://elasticsearch:9200"] index => "soc-events" } }
