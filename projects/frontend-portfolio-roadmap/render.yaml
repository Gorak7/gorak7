services:
  - type: web
    name: syncboard-api
    runtime: docker
    rootDir: projects/frontend-portfolio-roadmap/syncboard/server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: SQLITE_PATH
        value: /var/data/syncboard.sqlite
      - key: CORS_ORIGIN
        value: https://syncboard-ui.onrender.com
    disk:
      name: syncboard-data
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: syncboard-ui
    runtime: docker
    rootDir: projects/frontend-portfolio-roadmap/syncboard/client
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_WS_URL
        value: wss://syncboard-api.onrender.com/ws