services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iocdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - ioc_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iocdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/iocdb
      JWT_SECRET: change-this-demo-secret-before-production
      DEMO_MODE: "false"
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  ioc_data:
