services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - incident_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidentdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/incidentdb
      JWT_SECRET: change-this-demo-secret-before-production
      DEMO_MODE: "false"
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  incident_data:
