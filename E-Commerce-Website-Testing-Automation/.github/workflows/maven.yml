name: E-commerce QA build and tests
on:
  push:
    paths:
      - 'E-Commerce-Website-Testing-Automation/**'
  pull_request:
    paths:
      - 'E-Commerce-Website-Testing-Automation/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: E-Commerce-Website-Testing-Automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package application
        run: mvn -B -DskipTests package
      - name: Start application and run API + browser tests
        shell: bash
        run: |
          java -jar target/ecommerce-qa-automation-1.0.0.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/api/health; then
              break
            fi
            sleep 3
          done
          curl --fail http://localhost:8080/api/health
          mvn -B test -Dheadless=true
