<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gorak Shop | QA Demo</title><style>:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#18233f;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header h1{font-size:22px;margin:0}header span{background:#344565;padding:8px 12px;border-radius:20px}main{max-width:1100px;margin:28px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.intro p,.muted{color:#69758a}.search{padding:12px;border:1px solid #d4dbea;border-radius:10px;min-width:250px;font-size:15px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px}.product,.panel{background:white;border:1px solid #e4e8f0;border-radius:14px;padding:20px;box-shadow:0 4px 14px #18233f0a}.emoji{font-size:42px}.price{font-weight:800;font-size:20px;margin:14px 0}.btn{border:0;border-radius:9px;background:#375fe8;color:white;padding:11px 14px;font-weight:700;cursor:pointer}.panel{margin-top:24px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fields input{padding:12px;border:1px solid #d4dbea;border-radius:8px;font-size:15px}.cart-line{padding:9px 0;border-bottom:1px solid #edf0f5}.success{background:#e6f8ef;color:#14643b;padding:14px;border-radius:9px;margin-top:14px}.error{color:#b42318}footer{text-align:center;color:#778197;padding:30px}</style></head><body><header><h1>🛍️ Gorak Shop</h1><span data-testid="cart-count">Cart: 0</span></header><main><section class="intro"><div><h2>Everyday tech, made simple.</h2><p>Demo storefront for end-to-end QA automation.</p></div><input class="search" id="search" data-testid="product-search" placeholder="Search products..." aria-label="Search products"></section><section class="products" id="products"></section><section class="panel"><h2>Your cart</h2><div id="cart-items"><p class="muted">Your cart is empty.</p></div><p><strong>Total: <span data-testid="cart-total">₹0.00</span></strong></p></section><section class="panel"><h2>Demo checkout</h2><p class="muted">No real payment is collected.</p><form id="checkout"><div class="fields"><input id="customer-name" data-testid="customer-name" placeholder="Full name" required minlength="2"><input id="customer-email" data-testid="customer-email" type="email" placeholder="Email address" required></div><p><button class="btn" data-testid="checkout-submit" type="submit">Place demo order</button></p></form><div id="message" aria-live="polite"></div></section></main><footer>QA training application · Sample products · No real payments</footer><script>
var products=[],cart=[];function money(n){return '₹'+Number(n).toFixed(2)}function renderProducts(items){var el=document.getElementById('products');el.innerHTML='';items.forEach(function(p){var card=document.createElement('article');card.className='product';card.setAttribute('data-testid','product-card');card.innerHTML='<div class="emoji">'+({'Audio':'🎧','Accessories':'⌨️','Wearables':'⌚'}[p.category]||'📦')+'</div><h3>'+p.name+'</h3><p class="muted">'+p.description+'</p><div class="price">'+money(p.price)+'</div><button class="btn" data-testid="add-to-cart">Add to cart</button>';card.querySelector('button').onclick=function(){cart.push(p.id);renderCart()};el.appendChild(card)})}function renderCart(){document.querySelector('[data-testid="cart-count"]').textContent='Cart: '+cart.length;var selected=cart.map(function(id){return products.find(function(p){return p.id===id})}).filter(Boolean);document.getElementById('cart-items').innerHTML=selected.length?selected.map(function(p,i){return '<div class="cart-line">'+p.name+' — '+money(p.price)+' <button class="btn" data-remove="'+i+'">Remove</button></div>'}).join(''):'<p class="muted">Your cart is empty.</p>';document.querySelector('[data-testid="cart-total"]').textContent=money(selected.reduce(function(s,p){return s+p.price},0));document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){cart.splice(Number(b.dataset.remove),1);renderCart()}})}fetch('/api/products').then(function(r){return r.json()}).then(function(data){products=data;renderProducts(products)}).catch(function(){document.getElementById('products').textContent='Could not load products. Is the API running?'});document.getElementById('search').addEventListener('input',function(e){var q=e.target.value.toLowerCase();renderProducts(products.filter(function(p){return p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)}))});document.getElementById('checkout').addEventListener('submit',function(e){e.preventDefault();var msg=document.getElementById('message');if(!cart.length){msg.className='error';msg.textContent='Please add at least one product before checkout.';return}fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('customer-name').value,email:document.getElementById('customer-email').value,productIds:cart.slice()})}).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.message||'Unable to create order');return data})}).then(function(data){msg.className='success';msg.setAttribute('data-testid','order-confirmation');msg.textContent='Order confirmed! Order ID: '+data.orderId+' · Total: '+money(data.total);cart=[];renderCart();e.target.reset()}).catch(function(err){msg.className='error';msg.textContent=err.message})});
</script></body></html>
