# EXAMPLE ONLY — paths and permissions differ by Linux distribution.
# Use only the stanzas that match your endpoint. Configure outputs.conf separately.

[monitor:///var/log/auth.log]
disabled = 0
index = linux
sourcetype = linux_secure

[monitor:///var/log/syslog]
disabled = 0
index = linux
sourcetype = syslog

# Some distributions use /var/log/secure instead of /var/log/auth.log.
# Avoid monitoring duplicate files or journald exports that produce duplicate events.
