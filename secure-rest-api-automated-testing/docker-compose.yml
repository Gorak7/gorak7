services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: \${DB_NAME:-secure_api}
      MYSQL_USER: \${DB_USER:-secure_api_user}
      MYSQL_PASSWORD: \${DB_PASS:-change_me}
      MYSQL_ROOT_PASSWORD: \${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p\${MYSQL_ROOT_PASSWORD:-local_root_change_me}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: \${DB_NAME:-secure_api}
      DB_USER: \${DB_USER:-secure_api_user}
      DB_PASS: \${DB_PASS:-change_me}
      API_RATE_LIMIT: \${API_RATE_LIMIT:-60}
      API_RATE_WINDOW: \${API_RATE_WINDOW:-60}
      APP_DEBUG: "false"
    ports: ["8000:80"]
volumes:
  mysql_data:
