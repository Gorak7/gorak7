title: Suspicious PowerShell - Assumed Breach Lab
id: 5f6a2d0a-1b2c-4d0e-8f11-000000000001
status: experimental
description: Detects synthetic PowerShell telemetry containing suspicious execution characteristics.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\powershell.exe'
  suspicious:
    CommandLine|contains:
      - 'ExecutionPolicy Bypass'
      - '[SIMULATED]'
  condition: selection and suspicious
level: high
tags:
  - attack.execution
  - attack.t1059.001
