title: Discovery Commands - Assumed Breach Lab
id: 5f6a2d0a-1b2c-4d0e-8f11-000000000002
status: experimental
description: Detects synthetic discovery commands used by the lab scenario.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'whoami'
      - 'ipconfig'
      - 'systeminfo'
  condition: selection
level: medium
