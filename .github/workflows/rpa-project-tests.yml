name: RPA portfolio tests
on:
  push:
    branches: [main, rpa-invoice-bot-monitoring]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - RPA-Invoice-Processing-Bot
          - Bot-Monitoring-Failure-Alert-Tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.project }}/requirements.txt
      - name: Install test runner
        run: python -m pip install pytest>=8,<9
      - name: Run tests
        run: pytest -q ${{ matrix.project }}/tests
