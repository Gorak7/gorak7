name: RPA portfolio tests
on:
  push:
    branches: [main, rpa-invoice-bot-monitoring]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - RPA-Invoice-Processing-Bot
          - Bot-Monitoring-Failure-Alert-Tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: \${{ matrix.project }}/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "\${{ matrix.project }}/requirements.txt"
      - name: Run tests
        run: python -m pytest -q "\${{ matrix.project }}/tests"
