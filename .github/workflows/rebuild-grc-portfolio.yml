name: Rebuild GRC portfolio deliverables

on:
  push:
    paths:
      - "scripts/rebuild-grc-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document-generation dependencies
        run: python -m pip install --upgrade openpyxl python-docx
      - name: Regenerate and validate GRC workbooks and reports
        run: |
          python scripts/generate_grc_portfolio.py
          cp GRC-Analyst-Portfolio/02_Third_Party_Vendor_Risk_Assessment/Vendor_Assessment_Report.docx GRC-Analyst-Portfolio/02_Third_Party_Vendor_Risk_Assessment/Vendor_Assessment_Report_Template.docx
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from openpyxl import load_workbook
          from docx import Document

          root = Path("GRC-Analyst-Portfolio")
          files = [
              root / "01_Mini_Compliance_Program_ISO27001/ISO27001_Mini_Compliance_Program.xlsx",
              root / "01_Mini_Compliance_Program_ISO27001/Management_Compliance_Summary.docx",
              root / "02_Third_Party_Vendor_Risk_Assessment/Third_Party_Vendor_Risk_Assessment.xlsx",
              root / "02_Third_Party_Vendor_Risk_Assessment/Vendor_Assessment_Report_Template.docx",
          ]
          for path in files:
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, f"Corrupt ZIP member in {path}"
          load_workbook(files[0], data_only=False)
          load_workbook(files[2], data_only=False)
          Document(files[1])
          Document(files[3])
          assert len(files) == 4 and all(p.exists() and p.stat().st_size > 0 for p in files)
          print("All four GRC deliverables passed package and parser validation.")
          PY
      - name: Commit regenerated deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRC-Analyst-Portfolio/01_Mini_Compliance_Program_ISO27001/ISO27001_Mini_Compliance_Program.xlsx
          git add GRC-Analyst-Portfolio/01_Mini_Compliance_Program_ISO27001/Management_Compliance_Summary.docx
          git add GRC-Analyst-Portfolio/02_Third_Party_Vendor_Risk_Assessment/Third_Party_Vendor_Risk_Assessment.xlsx
          git add GRC-Analyst-Portfolio/02_Third_Party_Vendor_Risk_Assessment/Vendor_Assessment_Report_Template.docx
          if ! git diff --cached --quiet; then
            git commit -m "Replace GRC portfolio workbooks and reports with validated versions"
            git push
          else
            echo "No deliverable changes to commit."
          fi
