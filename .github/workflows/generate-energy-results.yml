name: Generate Energy Analysis Results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Energy-Consumption-Forecasting-Anomaly-Detection/requirements.txt
      - name: Install dependencies
        working-directory: Energy-Consumption-Forecasting-Anomaly-Detection
        run: python -m pip install -r requirements.txt
      - name: Generate deterministic synthetic data
        working-directory: Energy-Consumption-Forecasting-Anomaly-Detection
        run: python src/generate_data.py
      - name: Run analysis and create charts
        working-directory: Energy-Consumption-Forecasting-Anomaly-Detection
        run: python src/analyze_energy.py
      - name: Assemble tracked Results folder
        working-directory: Energy-Consumption-Forecasting-Anomaly-Detection
        run: python src/export_results.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Energy-Consumption-Forecasting-Anomaly-Detection/Results
          if git diff --cached --quiet; then
            echo "Results are unchanged; no commit is required."
          else
            git commit -m "Generate reproducible energy analysis results"
            git push
          fi
