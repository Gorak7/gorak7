name: AI Quality Engineer portfolio CI

on:
  push:
    paths:
      - "LICENSE"
      - "qa-automation-framework/**"
      - "rag-eval-pipeline/**"
      - "llm-test-generator/**"
      - ".github/workflows/ai-quality-engineer.yml"
  pull_request:
    paths:
      - "LICENSE"
      - "qa-automation-framework/**"
      - "rag-eval-pipeline/**"
      - "llm-test-generator/**"
      - ".github/workflows/ai-quality-engineer.yml"
  workflow_dispatch:

concurrency:
  group: ai-quality-engineer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-api-and-web:
    name: API and browser automation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-automation-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qa-automation-framework/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run API regression
        run: python -m pytest -m api --alluredir=allure-results/api -q
      - name: Run Playwright browser regression
        run: python -m pytest -m web --ignore=tests/web/test_selenium_smoke.py --alluredir=allure-results/web -q
      - name: Upload API and browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-api-web-allure-results
          path: qa-automation-framework/allure-results/
          if-no-files-found: warn
          retention-days: 30

  android-appium:
    name: Android emulator Appium tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Appium tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python -m pip install --upgrade pip
            pip install -r "$GITHUB_WORKSPACE/qa-automation-framework/requirements.txt"
            npm install --global appium@2
            appium driver install uiautomator2
            curl -fL https://raw.githubusercontent.com/appium/appium/master/packages/appium/sample-code/apps/ApiDemos-debug.apk -o /tmp/ApiDemos-debug.apk
            adb install /tmp/ApiDemos-debug.apk
            appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4723/status > /dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:4723/status
            PYTHONPATH="$GITHUB_WORKSPACE/qa-automation-framework" RUN_APPIUM=1 APPIUM_URL=http://127.0.0.1:4723 python -m pytest "$GITHUB_WORKSPACE/qa-automation-framework/tests" -m mobile --alluredir="$GITHUB_WORKSPACE/qa-automation-framework/allure-results/mobile" -q
      - name: Upload Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-android-appium-allure-results
          path: qa-automation-framework/allure-results/mobile/
          if-no-files-found: warn
          retention-days: 30

  rag-deterministic:
    name: RAG dataset review and deterministic evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-eval-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-eval-pipeline/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install fastapi uvicorn pydantic python-dotenv pytest httpx
      - name: Validate reviewed 60-case dataset
        run: python -m evals.review_dataset
      - name: Run RAG API tests
        run: python -m pytest -q tests
      - name: Run retrieval source-hit evaluation
        run: python -m evals.evaluate
      - name: Upload RAG evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-dataset-and-baseline-reports
          path: rag-eval-pipeline/reports/
          if-no-files-found: warn
          retention-days: 30

  rag-llm-judges:
    name: Ragas and DeepEval Gemini evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-eval-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Ragas and DeepEval when Gemini key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::LLM judge metrics were not run because repository secret GEMINI_API_KEY is not configured."
            echo "Configure Settings > Secrets and variables > Actions > New repository secret."
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -r requirements-eval.txt
          python -m evals.run_ragas --limit 60
          python -m evals.run_deepeval --limit 60
      - name: Upload LLM judge evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-llm-judge-reports
          path: rag-eval-pipeline/reports/
          if-no-files-found: warn
          retention-days: 30

  test-generator-and-mutation:
    name: OpenAPI generator and API mutation testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-test-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: llm-test-generator/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run generator contract tests and HTTP mutation suite
        run: python -m pytest -q
      - name: Save mutation report
        run: mkdir -p reports && python -m mutants.mutation_lab > reports/mutation-report.json
      - name: Upload generator and mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-generator-mutation-report
          path: llm-test-generator/reports/
          if-no-files-found: warn
          retention-days: 30
