name: Python project checks
on:
  push:
    paths:
      - 'System-Health-Monitor/**'
      - 'Log-Analyzer-Incident-Summary/**'
      - 'Network-Uptime-Checker/**'
      - '.github/workflows/python-projects.yml'
  pull_request:
    paths:
      - 'System-Health-Monitor/**'
      - 'Log-Analyzer-Incident-Summary/**'
      - 'Network-Uptime-Checker/**'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [System-Health-Monitor, Log-Analyzer-Incident-Summary, Network-Uptime-Checker]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
