name: QA automation
on: [push,pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install fastapi uvicorn pydantic pytest httpx
      - run: pytest -m api --alluredir=allure-results -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-allure-results
          path: allure-results
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m web --alluredir=allure-results -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-allure-results
          path: allure-results
