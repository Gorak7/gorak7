services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qadb
      POSTGRES_USER: qauser
      POSTGRES_PASSWORD: qapass-local-only
    ports:
      - "5432:5432"
    volumes:
      - qa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qauser -d qadb"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/qadb
      SPRING_DATASOURCE_USERNAME: qauser
      SPRING_DATASOURCE_PASSWORD: qapass-local-only
      QA_API_KEY: qa-demo-key
    ports:
      - "8080:8080"
volumes:
  qa-postgres-data:
