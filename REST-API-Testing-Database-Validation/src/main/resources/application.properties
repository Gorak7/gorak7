spring.application.name=qa-api-validation
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qadb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:qauser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qapass-local-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
qa.api-key=${QA_API_KEY:qa-demo-key}
server.error.include-message=always
